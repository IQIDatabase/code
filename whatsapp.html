<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Mockup Generator</title>

    <style>
        @font-face {
            font-family: 'light';
            src: url('fonts/SFNSDisplay-Light.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'bold';
            src: url('fonts/SFNSDisplay-Semibold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {

            font-family: 'light';
        }

        body {
            zoom: 3;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
            background: #0b141a;
            display: flex;
            justify-content: center;
            /* padding: 20px; */
        }

        .phone {
            width: 990px;
            height: 644px;
            background: #e5ddd5;
            /* border-radius: 30px; */
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 14px;
            font-weight: 600;
        }

        .chat {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background-image: url("https://raw.githubusercontent.com/IQIDatabase/code/refs/heads/main/bg.png");
            /* background-image: 'bg.png'; */
            background-size: cover;
            /* background-color: red; */
            position: relative;
        }

        .like {
            /* background-image: url("like.png"); */
            position: absolute;
            background-size: cover;
            width: 15px;
            height: 15px;
            bottom: -20px;
            left: 5px;
            outline: 2px solid #fdf5f3;
            padding: 5px 7px;
            background-color: #fffeff;
            border-radius: 50%;
        }

        img {
            max-width: 100%;
            width: 100%;
        }

        .msg {
            max-width: 70%;
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.3;
            clear: both;
            white-space: pre-wrap;
            /* IMPORTANT: keeps line breaks */
        }

        .me {
            background: #ddfed9;
            float: right;
            /* border-top-right-radius: 0; */
        }

        .them {
            background: #fffeff;
            float: left;
            /* border-top-left-radius: 0; */
        }

        .input-bar {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 8px;
        }

        textarea {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            outline: none;
            resize: none;
            height: 40px;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            border: none;
            background: #075e54;
            color: white;
            padding: 10px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            font-size: 28px;
            color: rgba(0, 0, 0, 0.08);
            font-weight: 800;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="phone" id="phone">
        <!-- <div class="header">Messages</div> -->

        <div class="chat" id="chat">
            <!-- <div class="watermark">DEMO<br>NOT REAL CHAT</div> -->
        </div>

        <div class="input-bar">
            <textarea id="msg" placeholder="Type message..."></textarea>
            <button onclick="sendMsg('me')">Me</button>
            <button onclick="sendMsg('them')">Them</button>
            <button id="out">Out</button>
            <button id="in">IN</button>
        </div>
    </div>

    <script>
        function sendMsg(type) {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if (!text) return;

            const div = document.createElement("div");
            div.className = "msg " + (type === "me" ? "me" : "them");
            div.textContent = text;
            div.style.position = "relative";
            document.getElementById("chat").appendChild(div);
            input.value = "";
            const like = document.createElement("div");
            like.className = "like"
            like.innerHTML += "<img src='https://raw.githubusercontent.com/IQIDatabase/code/refs/heads/main/like.png></img>"
            div.appendChild(like)

            const chat = document.getElementById("chat");
            chat.scrollTop = chat.scrollHeight;
        }

        // Enter = send, Shift+Enter = new line
        const msgBox = document.getElementById("msg");

        msgBox.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMsg('me');
            }
        });
        let scale = 1;

        document.getElementById("out").addEventListener("click", () => {
            scale = Math.max(0.2, scale - 0.05);

            document.getElementById("phone").style.transform = `scale(${scale})`;
        })

        document.getElementById("in").addEventListener("click", () => {
            scale = Math.max(0.2, scale + 0.01);

            document.getElementById("phone").style.transform = `scale(${scale})`;
        })

    </script>

</body>

</html>
