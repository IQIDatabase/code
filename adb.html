<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADB Package Tool</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1f2937, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.7);
            color: #ffffff;
            border-radius: 16px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            transition: all 0.25s ease;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }

        .button-group {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .process-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            flex: 1;
        }

        .process-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .output-box {
            background: rgba(2, 6, 23, 0.85);
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
                border-radius: 20px;
            }

            .title {
                font-size: 26px;
            }

            .button-group {
                flex-direction: column;
            }

            .process-btn,
            .reset-btn {
                width: 100%;
            }
        }

        #output {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="title">ADB Package Tool</h1>
        <p class="subtitle">
            Paste your ADB package names below and process them instantly.
        </p>

        <div class="field">
            <label for="inputPackage">ADB Package Name</label>
            <textarea id="inputPackage"
                placeholder="Example:\ncom.facebook.katana\ncom.instagram.android\ncom.google.android.youtube">
1
2
3
4
5</textarea>
        </div>

        <div class="button-group">
            <button class="process-btn" type="button" onclick="processPackage()">
                Process
            </button>

            <button class="reset-btn" type="button" onclick="resetFields()">
                Reset
            </button>
        </div>

        <div class="field">
            <label for="output">Output</label>
            <textarea id="output" class="output-box" readonly placeholder="Fetching Data..."></textarea>
        </div>


    </div>

    <script>
        function loadLastRow() {
            fetch("https://script.google.com/macros/s/AKfycbxNGYGeZVO5GRshambkeHrSxWDo9zccFpHYG6DBJ5sT20rnt8xgIVqGh_KHwnrrnCvZ/exec")
                .then(res => res.json())
                .then(data => {
                    document.getElementById('output').value = data.lastRow[0]
                });
        }

        loadLastRow();


        function processPackage() {
            let input = document.getElementById('inputPackage').value;
            let output_txt = document.getElementById('output');
            let final = []
            input = input.split("\n")
            input.forEach((e, i) => {

                if (i % 2 != 0 && i != 0) {
                    final.push(e)
                }
            });

            if (input === '') {
                output.value = 'Please enter a package name first.';
                return;
            }
            let final_output = []
            const lines = input.map(e => {

                let output = `adb shell cmd appops set ${e} RUN_IN_BACKGROUND ignore,adb shell cmd appops set ${e} RUN_ANY_IN_BACKGROUND ignore,adb shell cmd appops set ${e} WAKE_LOCK ignore,adb shell am set-standby-bucket,adb shell dumpsys deviceidle whitelist -${e},adb shell cmd appops set ${e} FOREGROUND_SERVICE ignore`
                output = output.split(",").map(e => e.trim()).join("\n")
                final_output.push(output, "")
            })
            final_output = final_output.join("\n")
            output_txt.value = final_output
            sendData(final_output)
        }

        function resetFields() {
            document.getElementById('inputPackage').value = '';
            document.getElementById('output').value = '';
        }
        function sendData(final_output) {
            fetch("https://script.google.com/macros/s/AKfycbxNGYGeZVO5GRshambkeHrSxWDo9zccFpHYG6DBJ5sT20rnt8xgIVqGh_KHwnrrnCvZ/exec", {
                method: "POST",
                body: JSON.stringify({
                    name: final_output
                })
            })
                .then(res => res.text())
                .then(data => alert("Saved to Sheet!"));
        }
        document.getElementById("output").addEventListener("click", function () {
            this.select();
            this.setSelectionRange(0, 99999); // mobile support

            navigator.clipboard.writeText(this.value)
                .then(() => {
                    alert("Copied!");
                })
                .catch(err => {
                    console.log("Copy failed", err);
                });
        });
    </script>

</body>

</html>
