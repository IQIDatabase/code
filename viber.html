<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Mockup Generator</title>

    <style>
        @font-face {
            font-family: 'light';
            src: url('fonts/SFNSDisplay-Light.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'bold';
            src: url('fonts/SFNSDisplay-Semibold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {

            font-family: 'light';
        }

        body {
            zoom: 3;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
            background: black;
            display: flex;
            justify-content: center;
            /* padding: 20px; */
        }

        .phone {
            width: 990px;
            height: 260px;
            background: black;
            /* border-radius: 30px; */
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 14px;
            font-weight: 600;
        }

        .chat {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            /* background-image: url("bg.png"); */
            /* background-image: 'bg.png'; */
            background-size: cover;
            /* background-color: red; */
        }

        .msg {
            max-width: 70%;
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.3;
            clear: both;
            white-space: pre-wrap;
            /* IMPORTANT: keeps line breaks */
        }

        .me {
            position: relative;
            background: #3e4750;
            float: right;
            color: white;
            /* border-top-right-radius: 0; */
        }

        .them {
            position: relative;
            background: #1f232c;
            float: left;
            color: white;
            border-top-left-radius: 0;
            position: relative
        }

        .input-bar {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 8px;
        }

        textarea {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            outline: none;
            resize: none;
            height: 40px;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            border: none;
            background: #075e54;
            color: white;
            padding: 10px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .time {
            position: absolute;
            color: #84878e;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
        }

        .time-right {
            position: absolute;
            color: #8b929c;
            bottom: 9px;
            right: 18px;
            font-size: 10px;
        }

        .time-left {
            position: absolute;
            color: #84878e;
            bottom: 9px;
            right: 10px;
            font-size: 10px;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            font-size: 28px;
            color: rgba(0, 0, 0, 0.08);
            font-weight: 800;
            pointer-events: none;
            text-align: center;
        }

        .check {
            max-width: 15px;
            position: absolute;
            bottom: 9px;
            right: 5px;
        }

        .heart {
            color: white;
            position: absolute;
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
            padding: 2.5px 2px 2px;
            background-color: #2d3134;
            border-radius: 50%;
            max-width: 15px;
        }

        .heart-left {
            color: white;
            position: absolute;
            right: -25px;
            top: 50%;
            transform: translateY(-50%);
            padding: 2.5px 2px 2px;
            background-color: #2d3134;
            border-radius: 50%;
            max-width: 15px;
        }
    </style>
</head>

<body>

    <div class="phone">
        <!-- <div class="header">Messages</div> -->

        <div class="chat" id="chat">
            <!-- <div class="watermark">DEMO<br>NOT REAL CHAT</div> -->
        </div>

        <div class="input-bar">
            <textarea id="msg" placeholder="Type message..."></textarea>
            <button onclick="sendMsg('me')">Me</button>
            <button onclick="sendMsg('them')">Them</button>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        function sendMsg(type) {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if (!text) return;

            const div = document.createElement("div");
            div.className = "msg " + (type === "me" ? "me" : "them");
            div.textContent = text;

            if (text.length >= 50 || text.includes("\n")) {
                if (type === "me") {

                    div.style.paddingBottom = "20px"

                    div.innerHTML += `<span class='time' style="right:20px !important">${getCurrentTime()}</span>`
                    div.innerHTML += `<img class="heart" src="heart.png">`
                    div.innerHTML += `<img class="check" src="check.png" style="bottom:5px !important">`
                } else {

                    div.style.paddingBottom = "20px"
                    div.innerHTML += `<img class="heart-left" src="heart.png">`
                    div.innerHTML += `<span class='time'>${getCurrentTime()}</span>`
                }

            } else {
                if (type === "me") {
                    div.style.paddingRight = "60px"
                    div.innerHTML += `<img class="check" src="check.png" style="bottom:9px !important">`
                    div.innerHTML += `<span class='time-right'>${getCurrentTime()}</span>`
                    div.innerHTML += `<img class="heart" src="heart.png">`
                } else {
                    div.style.paddingRight = "53px"
                    div.innerHTML += `<img class="heart-left" src="heart.png">`
                    div.innerHTML += `<span class='time-left'>${getCurrentTime()}</span>`
                }
            }

            document.getElementById("chat").appendChild(div);
            input.value = "";

            const chat = document.getElementById("chat");
            chat.scrollTop = chat.scrollHeight;
        }

        // Enter = send, Shift+Enter = new line
        const msgBox = document.getElementById("msg");

        msgBox.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMsg('me');
            }
        });

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12 || 12;

            return `${hours}:${minutes} ${ampm}`;
        }

        console.log(getCurrentTime());
    </script>

</body>

</html>
